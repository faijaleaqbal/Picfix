services:
  backend:
    build: .
    container_name: image-editor-backend
    ports: []
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - HOST=0.0.0.0
      - PORT=3000
      - RUN_WORKER_INPROCESS=0
      - TRUST_PROXY_SUBNET=172.20.0.0/16
      - AI_JOB_TIMEOUT_MS=60000
      - TEMP_DIR=/tmp/image-uploads
    volumes:
      - image-uploads:/tmp/image-uploads
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - backend-net

  nginx:
    image: nginx:alpine
    container_name: image-nginx-ingress
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: image-editor-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend-net

  ai-service:
    build: ../ai-service
    container_name: ai-service
    environment:
      - BACKEND_URL=http://backend:3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3072M
    networks:
      - backend-net

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://picfix.duckdns.org}
    container_name: image-editor-frontend
    ports:
      - "3005:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend-net

  worker:
    build: .
    container_name: image-editor-worker
    command: ["npm", "run", "worker"]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - HOST=0.0.0.0
      - PORT=3000
      - RUN_WORKER_INPROCESS=0
      - TRUST_PROXY_SUBNET=172.20.0.0/16
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - image-uploads:/tmp/image-uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  image-uploads:
  redis-data: