<!-- Script for interactive rotation -->
<script>
        const image = document.getElementById('target-image');
        const slider = document.getElementById('angle-slider');
        const input = document.getElementById('angle-input');
        const progress = document.getElementById('slider-progress');
        const gridHelper = document.getElementById('grid-helper');
        
        let currentRotation = 0;

        function updateRotation(angle, isScrubbing = false) {
            currentRotation = parseFloat(angle);
            image.style.transform = `rotate(${currentRotation}deg)`;
            
            // Limit bounds for display
            let displayAngle = currentRotation % 360;
            if(displayAngle > 180) displayAngle -= 360;
            if(displayAngle < -180) displayAngle += 360;
            
            // Only update slider/input if within normal -45 to 45 fine-tune range
            if (currentRotation >= -45 && currentRotation <= 45) {
                slider.value = currentRotation;
                input.value = currentRotation;
                
                // Update custom slider track
                const percentage = ((currentRotation + 45) / 90) * 100;
                progress.style.width = `${percentage}%`;
                
                if (currentRotation === 0) {
                    progress.style.backgroundColor = 'transparent';
                } else {
                    progress.style.backgroundColor = '#B48CDE'; // accent-lavender
                }
            }

            // Show grid helper while scrubbing
            if(isScrubbing) {
                gridHelper.classList.remove('opacity-0');
            } else {
                setTimeout(() => {
                    gridHelper.classList.add('opacity-0');
                }, 300);
            }
        }

        function setRotation(presetAngle) {
            // For presets, we usually just set absolute or add. Let's do absolute for simplicity in this demo.
            updateRotation(presetAngle);
        }

        slider.addEventListener('input', (e) => {
            updateRotation(e.target.value, true);
        });
        
        slider.addEventListener('change', (e) => {
             updateRotation(e.target.value, false);
        });

        input.addEventListener('change', (e) => {
            let val = parseFloat(e.target.value);
            if(isNaN(val)) val = 0;
            if(val > 45) val = 45;
            if(val < -45) val = -45;
            updateRotation(val);
        });
        
        // Initialize
        updateRotation(0);
    </script>
